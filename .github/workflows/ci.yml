name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck, test, and build every package
        # No TYPESAFE_API_KEY, deliberately. Every test in this repository must
        # pass without a credential and without network access — the offline
        # path is the default contract, so CI holds it to that.
        env:
          TYPESAFE_API_KEY: ''
        run: pnpm run check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

      - name: Verify each published package contains what it needs
        # `files` in each manifest must cover the artifacts the package needs to
        # load. A missing entry here is a broken publish that `npm install`
        # would not catch, because the tarball installs fine — it just does not
        # work.
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const fsp = require('node:fs');
            const path = require('node:path');

            const required = {
              'packages/core': ['lib/index.js', 'lib/index.d.ts', 'README.md', 'LICENSE'],
              'packages/dsh': ['lib/index.js', 'lib/index.d.ts', 'cordis.patch.yml', 'README.md', 'LICENSE'],
              'packages/mcp': ['lib/index.js', 'lib/bin.js', 'lib/index.d.ts', 'README.md', 'LICENSE'],
            };

            let failed = false;
            for (const [dir, wanted] of Object.entries(required)) {
              const out = execSync('npm pack --dry-run --json', { cwd: dir, encoding: 'utf8' });
              const files = JSON.parse(out)[0].files.map((f) => f.path);
              const missing = wanted.filter((w) => !files.includes(w));
              if (missing.length) {
                console.error(\`\${dir}: missing from the published package -> \${missing.join(', ')}\`);
                failed = true;
              } else {
                console.log(\`\${dir}: \${files.length} files, all required present\`);
              }
            }
            if (failed) process.exit(1);
          "
