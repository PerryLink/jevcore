name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 was dropped: GitHub Actions warned it is deprecated on runners, and
        # `engines` still declares >=20 so the floor is unchanged -- this tests
        # the two versions actually in use rather than one that is on its way out.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # setup-node v5 turns package-manager caching on by itself when
          # package.json declares `packageManager`, and this repository pins
          # one. That makes the action run `pnpm` before `corepack enable`
          # has put it on PATH, and the step dies with "Unable to locate
          # executable file: pnpm".
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck, test, and build every package
        # No TYPESAFE_API_KEY, deliberately. Every test in this repository must
        # pass without a credential and without network access — the offline
        # path is the default contract, so CI holds it to that.
        env:
          TYPESAFE_API_KEY: ''
        run: pnpm run check

      - name: Drive the MCP server over a real stdio transport
        # The unit tests cover the tools; this covers the wire protocol —
        # handshake, discovery, calls, and the error path.
        env:
          TYPESAFE_API_KEY: ''
        run: pnpm --filter jevcore-mcp run smoke

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          # setup-node v5 turns package-manager caching on by itself when
          # package.json declares `packageManager`, and this repository pins
          # one. That makes the action run `pnpm` before `corepack enable`
          # has put it on PATH, and the step dies with "Unable to locate
          # executable file: pnpm".
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build

      - name: Verify each published package contains what it needs
        # `files` in each manifest must cover the artifacts the package needs to
        # load. A missing entry is a broken publish that a plain install would not
        # catch, because the tarball installs fine — it just does not work.
        #
        # `pnpm pack`, never `npm pack`: only pnpm rewrites the `workspace:*`
        # dependency into a real version. An npm-packed tarball is not installable
        # at all, which is the failure this step exists to catch.
        run: |
          node -e "
            const { execSync } = require('node:child_process');

            const required = {
              'packages/core': ['lib/index.js', 'lib/index.d.ts', 'src/index.ts', 'README.md', 'README-zh.md', 'README-es.md', 'README-pt.md', 'README-hi.md', 'CHANGELOG.md', 'LICENSE', 'NOTICE', 'docs/quickstart.md', 'docs/hosts.md', 'docs/approval.md', 'docs/limits.md', 'scripts/probe-openrouter-live.mjs'],
              'packages/dsh': ['lib/index.js', 'lib/index.d.ts', 'src/index.ts', 'cordis.patch.yml', 'skills/typesafe-ai-dsh/SKILL.md', 'README.md', 'README-zh.md', 'README-es.md', 'README-pt.md', 'README-hi.md', 'CHANGELOG.md', 'LICENSE', 'NOTICE', 'docs/quickstart.md', 'docs/hosts.md', 'docs/approval.md', 'docs/limits.md'],
              'packages/mcp': ['lib/index.js', 'lib/bin.js', 'lib/index.d.ts', 'src/index.ts', 'README.md', 'README-zh.md', 'README-es.md', 'README-pt.md', 'README-hi.md', 'CHANGELOG.md', 'LICENSE', 'NOTICE', 'docs/quickstart.md', 'docs/hosts.md', 'docs/approval.md', 'docs/limits.md', 'scripts/mcp-smoke.mjs', 'scripts/mcp-smoke-live.mjs'],
              'packages/cli': ['lib/index.js', 'lib/bin.js', 'lib/index.d.ts', 'README.md', 'README-zh.md', 'README-es.md', 'README-pt.md', 'README-hi.md', 'CHANGELOG.md', 'LICENSE', 'NOTICE', 'docs/quickstart.md', 'docs/hosts.md', 'docs/approval.md', 'docs/limits.md'],
            };

            // The docs/ entries are here for the same reason the READMEs are:
            // the four documents were in no package's files array at all, so an
            // npm install shipped a plugin with no quickstart and no statement of
            // the deployment boundaries -- while the repository looked complete.
            // They are generated copies now, kept in sync by
            // scripts/sync-package-docs.mjs, and this list is what makes a stale
            // copy fail rather than ship.

            // The five READMEs and CHANGELOG.md are in this list because they
            // were NOT in the tarballs until 0.2.2. They were listed in files
            // from the start while the package directories held none, so npm
            // dropped them silently and the guard above, which only asked for
            // README.md, never noticed. What a gate does not name, it does not
            // protect.

            // NOTE: this script contains no backtick characters at all, not even
            // in comments. It runs as node -e "..." under bash, and bash
            // performs command substitution on backticks BEFORE node sees the
            // program -- a comment is not exempt. The result was a syntax error
            // reported far from its cause: node refused to parse the workspace
            // package.json, because a stray backtick pair had been replaced by
            // an empty string. Use single quotes and concatenation only.

            let failed = false;

            // pnpm pack --dry-run --json prints a JSON object, not the
            // single-element array that npm pack --json prints. Indexing [0] on
            // it is what broke this step first: the manifest was never read, and
            // the step reported "Cannot read properties of undefined".
            //
            // Walk the braces to isolate the object, then accept either shape so
            // the step does not silently depend on which packer ran.
            const firstJsonValue = (raw) => {
              const start = raw.indexOf('{');
              if (start === -1) throw new Error('no JSON object in pnpm pack output');
              let depth = 0;
              let inString = false;
              let escaped = false;
              for (let i = start; i < raw.length; i += 1) {
                const ch = raw[i];
                if (inString) {
                  if (escaped) escaped = false;
                  else if (ch === '\\\\') escaped = true;
                  else if (ch === '\"') inString = false;
                  continue;
                }
                if (ch === '\"') inString = true;
                else if (ch === '{') depth += 1;
                else if (ch === '}') {
                  depth -= 1;
                  if (depth === 0) return JSON.parse(raw.slice(start, i + 1));
                }
              }
              throw new Error('unbalanced JSON object in pnpm pack output');
            };

            /** The file list from whichever shape the packer printed. */
            const readManifest = (raw) => {
              const parsed = firstJsonValue(raw);
              const manifest = Array.isArray(parsed) ? parsed[0] : parsed;
              if (!manifest || !Array.isArray(manifest.files)) return undefined;
              return manifest.files.map((f) => f.path);
            };

            for (const [dir, wanted] of Object.entries(required)) {
              const out = execSync('pnpm pack --dry-run --json', { cwd: dir, encoding: 'utf8' });
              const files = readManifest(out);
              if (files === undefined) {
                console.error(dir + ': could not read the file list from pnpm pack --json');
                failed = true;
                continue;
              }
              const missing = wanted.filter((w) => !files.includes(w));
              if (missing.length) {
                console.error(dir + ': missing from the published package -> ' + missing.join(', '));
                failed = true;
              } else {
                console.log(dir + ': ' + files.length + ' files, all required present');
              }
            }
            if (failed) process.exit(1);
          "

      - name: Install the packed tarballs as a consumer would
        # The check above proves the file list is right. This proves the tarballs
        # actually install and load, which is the part that catches a manifest
        # mistake rather than a `files` mistake.
        run: |
          rm -rf /tmp/cleanroom && mkdir -p /tmp/cleanroom && cd /tmp/cleanroom
          echo '{"name":"cleanroom","private":true,"version":"1.0.0"}' > package.json

          # Pack from inside the workspace, with an absolute destination. The
          # obvious form -- `pnpm --dir "$GITHUB_WORKSPACE" --filter X pack
          # --pack-destination .` -- resolves that "." against the workspace
          # root, not the current directory, so the tarballs landed in the
          # repository instead of here and npm install failed with ENOENT on a
          # literal './jevcore-*.tgz'.
          cd "$GITHUB_WORKSPACE"
          pnpm --filter jevcore pack --pack-destination /tmp/cleanroom
          pnpm --filter jevcore-mcp pack --pack-destination /tmp/cleanroom
          cd /tmp/cleanroom
          ls -1 *.tgz

          # Resolve the tarballs by shape, never by a literal version. This step
          # used to name './jevcore-0.1.0.tgz', which kept working for exactly as
          # long as the version stayed 0.1.0 and then failed with ENOENT on every
          # push from 0.1.1 onward -- while `ls -1 *.tgz` on the line above was
          # printing the real, differently-named files. `jevcore-[0-9]*`
          # deliberately does not match `jevcore-mcp-*`.
          CORE_TGZ="$(ls -1 ./jevcore-[0-9]*.tgz)"
          MCP_TGZ="$(ls -1 ./jevcore-mcp-*.tgz)"
          echo "installing $CORE_TGZ and $MCP_TGZ"

          npm install --no-audit --no-fund "$CORE_TGZ" "$MCP_TGZ"
          node -e "
            const core = await import('jevcore');
            const mcp = await import('jevcore-mcp');
            if (typeof core.JevService !== 'function') throw new Error('core did not load');
            if (typeof mcp.createServer !== 'function') throw new Error('mcp did not load');
            const runtime = await mcp.buildRuntime(() => undefined);
            if (runtime.config.provider !== 'mock') throw new Error('mcp default is not offline');
            console.log('clean-room install loads:', Object.keys(core).length, 'core exports');
          " --input-type=module
