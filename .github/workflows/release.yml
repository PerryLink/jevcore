name: Release

# Publishing is tag-driven on purpose: a human decides the version, the tag
# records when, and nothing reaches npm from a working branch.
#
# Authentication is OIDC trusted publishing — there is no NPM_TOKEN to store, and
# therefore none to leak or rotate. Configure it once per package at npmjs.com,
# under the package's Settings -> Trusted Publisher -> GitHub Actions:
#
#   organization or user : PerryLink
#   repository           : jevcore
#   workflow filename    : release.yml
#   environment          : (leave empty)
#
# The filename is matched exactly, extension included, so it is load-bearing:
# renaming this file silently breaks the release, and a mismatch shows up as an
# authentication failure rather than as a missing workflow. `release.yml` is also
# what 38 of the sibling plugin repositories call theirs (`publish.yml` appears in
# 7), which is why this file is not named after what it does.
#
# `id-token: write` below is what lets the runner mint the OIDC token that npm
# exchanges for publish rights for these three packages.
#
# Do NOT reintroduce a registry token. pnpm treats a configured
# `//registry.npmjs.org/:_authToken` as an instruction to publish with that token
# and skips the OIDC exchange, so a stale or empty token silently downgrades this
# workflow from trusted publishing to token publishing and then fails on auth.
# pnpm's own release workflow carries a comment about deleting that variable
# before its trusted-publishing step for exactly this reason. `actions/setup-node`
# writes the key into `.npmrc` whenever it is given `registry-url`, which is why
# no step below passes it.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC: without it the publish step cannot mint the token.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check what triggered this run
        run: |
          echo "event      = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "ref_name   = ${{ github.ref_name }}"

      - uses: actions/setup-node@v5
        with:
          # No `registry-url` here — see the note at the top of this file. It
          # would write an `_authToken` line into `.npmrc` and silently downgrade
          # the publish below.
          node-version: "22"
          # setup-node v5 turns package-manager caching on by itself when
          # package.json declares `packageManager`, and this repository pins one.
          # That runs `pnpm` before `corepack enable` has put it on PATH and the
          # step fails before the publish is ever reached. Caching is not worth
          # reordering the toolchain for: the pnpm that performs the OIDC
          # exchange must be the one corepack resolves.
          package-manager-cache: false

      - name: Enable corepack
        run: corepack enable

      - name: Report the toolchain
        # Printed because trusted publishing depends on the pnpm and npm versions
        # actually in use, and a runner image change is easier to read here than
        # to infer from an auth failure three steps later.
        run: |
          node --version
          pnpm --version
          npm --version

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Confirm the tag matches the manifests
        if: github.event_name == 'push'
        run: |
          node -e "
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const { readFileSync } = require('node:fs');
            const names = ['package.json', 'packages/core/package.json', 'packages/dsh/package.json', 'packages/mcp/package.json'];
            let failed = false;
            for (const file of names) {
              const version = JSON.parse(readFileSync(file, 'utf8')).version;
              if (version !== tag) {
                console.error(file + ': version ' + version + ' does not match tag ' + process.env.GITHUB_REF_NAME);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log('every manifest is at ' + tag);
          "

      - name: Verify before publishing
        run: pnpm run check

      - name: Publish
        # Core first: both adapters depend on `jevcore`.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          # A version already on the registry is skipped, not failed: a re-run, or
          # a release finished by hand after a partial failure, should not turn
          # green work red. A version that is *staged* on the registry is
          # invisible to this check -- npm's stage list reports total: 0 for it --
          # and publishing over it fails with 409.
          publish() {
            local pkg="$1" dir="$2" version
            version="$(node -p "require('./packages/$dir/package.json').version")"
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "$pkg@$version is already published; skipping"
              return 0
            fi
            echo "publishing $pkg@$version"
            pnpm --filter "$pkg" publish --access public --provenance --no-git-checks
          }

          publish jevcore core
          publish jevcore-dsh dsh
          publish jevcore-mcp mcp
