name: Publish

# Publishing is tag-driven on purpose: a human decides the version, the tag
# records when, and nothing reaches npm from a working branch.
#
# Requires a repository secret named NPM_TOKEN (npm automation token with publish
# rights for jevkit, jevkit-dsh and jevkit-mcp):
#   Settings -> Secrets and variables -> Actions -> New repository secret

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check what triggered this run
        run: |
          echo "event      = ${{ github.event_name }}"
          echo "ref        = ${{ github.ref }}"
          echo "ref_name   = ${{ github.ref_name }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Confirm the tag matches the manifests
        if: github.event_name == 'push'
        run: |
          node -e "
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            const { readFileSync } = require('node:fs');
            const names = ['package.json', 'packages/core/package.json', 'packages/dsh/package.json', 'packages/mcp/package.json'];
            let failed = false;
            for (const file of names) {
              const version = JSON.parse(readFileSync(file, 'utf8')).version;
              if (version !== tag) {
                console.error(file + ': version ' + version + ' does not match tag ' + process.env.GITHUB_REF_NAME);
                failed = true;
              }
            }
            if (failed) process.exit(1);
            console.log('every manifest is at ' + tag);
          "

      - name: Verify before publishing
        run: pnpm run check

      - name: Cross-check payloads against the vendor schemas
        run: pnpm --filter jevkit run check:schemas

      - name: Publish
        # Core first: both adapters depend on `jevkit`. `pnpm publish`, never
        # `npm publish`, so the workspace dependency becomes a real version.
        if: github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm --filter jevkit publish --access public --provenance --no-git-checks
          pnpm --filter jevkit-dsh publish --access public --provenance --no-git-checks
          pnpm --filter jevkit-mcp publish --access public --provenance --no-git-checks
