# pnpm workspace configuration.
#
# `allowBuilds` grants permission for a dependency's install-time build script to
# run. Without an explicit entry, pnpm 11 blocks the script AND exits non-zero on
# every subsequent command, which makes `pnpm run build` and `pnpm run test`
# unusable.
#
# One entry, read before being allowed:
#
#   esbuild — a transitive dependency of vitest (via vite), not of this project's
#             own code. Ships a prebuilt binary; its install script only selects
#             the correct one for the platform.
#
# `@openrouter/sdk` was listed here and is not any more. The OpenRouter route now
# runs the official TypeSafe client against `https://openrouter.ai/api`, which
# OpenRouter documents as the supported way to reach Jev, so that package is no
# longer a dependency at all. Removing it also removes an install-time network
# call: its postinstall fetched OpenRouter's public model list. This project's
# whole point is that install-time egress should be a decision somebody made, and
# the cheapest way to keep that true is to not run the script.
allowBuilds:
  esbuild: true

packages:
  - 'packages/*'
